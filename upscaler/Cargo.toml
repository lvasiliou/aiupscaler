[package]
name = "ai-upscaler"
version = "0.1.0"
edition = "2024"
description = "AI video upscaler: ONNX Runtime super-resolution + ffmpeg video/audio pipeline"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
half = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
indicatif = "0.18.6"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.14", features = ["ndarray", "half"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# DirectML (any DX12 GPU: AMD, Intel, NVIDIA) is always built in on Windows.
[target.'cfg(windows)'.dependencies]
ort = { version = "2.0.0-rc.14", features = ["directml"] }

[features]
default = []
# NVIDIA CUDA backend for ONNX Runtime (needs the CUDA + cuDNN runtime installed).
cuda = ["ort/cuda"]

[profile.release]
lto = "thin"
codegen-units = 1
